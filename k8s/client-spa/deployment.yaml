apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-spa
  namespace: animal-help-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-spa
  template:
    metadata:
      labels:
        app: client-spa
    spec:
      initContainers:
        - name: wait-for-resource-server
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - until curl -sf http://resource-server-service:3001/healthz; do echo "waiting for resource-server..."; sleep 5; done
      containers:
        - name: client-spa
          image: ghcr.io/jpolchowska/animal-help-client-spa:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
