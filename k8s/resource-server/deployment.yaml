apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-server
  namespace: animal-help-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: resource-server
  template:
    metadata:
      labels:
        app: resource-server
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -c
            - until pg_isready -h postgres-service -U postgres; do echo "waiting for postgres..."; sleep 2; done
        - name: wait-for-keycloak
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - until curl -sf http://keycloak-service:8080/realms/master; do echo "waiting for keycloak..."; sleep 5; done
        - name: seed-images
          image: ghcr.io/jpolchowska/animal-help-resource-server:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              if [ -d /app/images-seed ] && [ -z "$(ls -A /mnt/images 2>/dev/null)" ]; then
                echo "Seeding images..."
                cp -r /app/images-seed/. /mnt/images/
                echo "Done. $(ls /mnt/images | wc -l) images seeded."
              else
                echo "Images already present, skipping."
              fi
          volumeMounts:
            - name: images-storage
              mountPath: /mnt/images
      containers:
        - name: resource-server
          image: ghcr.io/jpolchowska/animal-help-resource-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: animal-help-config
                  key: PORT_RESOURCE
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: animal-help-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: animal-help-secret
                  key: DATABASE_URL
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: animal-help-config
                  key: KEYCLOAK_INTERNAL_URL
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: animal-help-secret
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: animal-help-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
          volumeMounts:
            - name: images-storage
              mountPath: /app/images
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: images-storage
          persistentVolumeClaim:
            claimName: resource-server-images-pvc
