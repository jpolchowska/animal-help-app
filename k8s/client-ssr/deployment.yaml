apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-ssr
  namespace: animal-help-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-ssr
  template:
    metadata:
      labels:
        app: client-ssr
    spec:
      initContainers:
        - name: wait-for-resource-server
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - until curl -sf http://resource-server-service:3001/healthz; do echo "waiting for resource-server..."; sleep 5; done
        - name: wait-for-keycloak
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - until curl -sf http://keycloak-service:8080/realms/master; do echo "waiting for keycloak..."; sleep 5; done
      containers:
        - name: client-ssr
          image: ghcr.io/jpolchowska/animal-help-client-ssr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: animal-help-config
                  key: PORT_SSR
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: animal-help-config
                  key: API_URL
            - name: API_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: animal-help-config
                  key: API_PUBLIC_URL
            - name: PORTAL_URL
              valueFrom:
                configMapKeyRef:
                  name: animal-help-config
                  key: PORTAL_URL
            - name: KEYCLOAK_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: animal-help-config
                  key: KEYCLOAK_INTERNAL_URL
            - name: KEYCLOAK_EXTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: animal-help-config
                  key: KEYCLOAK_EXTERNAL_URL
            - name: CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: animal-help-config
                  key: CLIENT_ID_SSR
            - name: REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: animal-help-config
                  key: REDIRECT_URI
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: animal-help-secret
                  key: SSR_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: animal-help-secret
                  key: SESSION_SECRET
          livenessProbe:
            httpGet:
              path: /
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
